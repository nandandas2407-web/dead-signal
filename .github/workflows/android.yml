name: Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: mkdir -p android/app/src/main/assets && cp src/index.html android/app/src/main/assets/index.html
      - run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: dead-signal-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
